name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 타입체크보다 먼저 돌린다.
      #  ① 타입체크만으로는 Next 빌드 단계의 오류(서버/클라이언트 경계 등)를 못 잡고
      #  ② next build 가 next-env.d.ts 를 생성하므로, 뒤따르는 tsc 가 Next 전역 타입까지
      #     갖춘 상태로 검사하게 된다 (그 파일은 생성물이라 커밋하지 않는다)
      - run: npm run build --workspace=admin

      - run: npm run typecheck --workspaces --if-present
